<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liftlog</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17181B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontLink" rel="stylesheet">
<style>
:root{
  --bg:#17181B; --ink:#ECE9E2; --accent:#F1C410; --var:#F1C410; --back:#4A8FE0; --fail:#E5735F;
  --paper:color-mix(in srgb,var(--bg),var(--ink) 6%);
  --line:color-mix(in srgb,var(--bg),var(--ink) 20%);
  --muted:color-mix(in srgb,var(--ink) 62%,var(--bg));
  --chipText:var(--ink);
  --fb:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --fh:var(--fb);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 var(--fb)}
main{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3,.cond{font-family:var(--fh)}
h1{font-size:2.25rem;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--var);outline-offset:2px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:720px;width:100%}
nav button{flex:1;background:none;border:0;padding:14px 8px;font-family:var(--fh);
  font-size:1.1rem;font-weight:500;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--ink);border-top-color:var(--var);font-weight:700}

/* list rows */
.row{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.row>button.head{display:flex;width:100%;align-items:baseline;gap:14px;text-align:left;background:none;border:0;padding:14px 16px}
.date{font-family:var(--fh);font-weight:700;font-size:1.35rem;min-width:5.2em}
.title{font-weight:500}
.meta{color:var(--muted);font-size:.9rem;margin-left:auto;white-space:nowrap}
.body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.ex{padding:10px 0;border-bottom:1px dashed var(--line)}
.ex:last-of-type{border-bottom:0}
.exname{font-weight:500}
.grp{font-family:var(--fh);font-weight:700;font-size:1.05rem;color:var(--muted);margin:18px 2px 8px}
.newex{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.nxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 12px;margin:10px 0}
.nxgrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;font-weight:400;text-transform:capitalize}
.nxgrid select{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.tabpick{display:flex;flex-wrap:wrap;gap:8px 16px}
.tabpick label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 14px}
.recs div{line-height:1.25}
.recs small{display:block;color:var(--muted);font-size:.8rem}
.recs b{display:block;font-family:var(--fh);font-size:1.2rem}
.mod{font-size:.78rem;border:1px solid var(--var);color:var(--var);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
#gear{background:none;border:0;padding:8px;margin-right:-8px;color:var(--muted);border-radius:6px}
#gear[aria-current="true"]{color:var(--var)}
.raw{color:var(--muted);font-size:.85rem;margin-left:6px}
.flag{font-size:.8rem;color:var(--fail);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--fh);font-size:1rem;padding:3px 9px;border-radius:4px;
  border:1px solid var(--line);color:var(--chipText);white-space:nowrap}
.chip.variant{border-style:dashed;border-color:var(--var);color:var(--var);background:transparent!important}
.chip.warm{opacity:.5}
.chip.failed{box-shadow:inset 0 -3px 0 var(--fail)}
.note{color:var(--muted);font-size:.9rem;margin-top:4px}
.note.fail{color:var(--fail)}
.wnotes{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:4px;white-space:pre-wrap}
.orig summary{cursor:pointer;color:var(--muted);margin-top:12px;font-size:.9rem}
.xdel{float:right;background:none;border:0;color:var(--muted);padding:2px 6px;font-size:.95rem}
.xdel.armed{color:var(--fail)}
.actions{margin-top:12px;display:flex;justify-content:flex-end}
.row,.hint,.mline,.ex,.map,.wnotes,.note,.issue,.sub{overflow-wrap:break-word;word-break:break-word}
.mhead>*,.recs>*,.two>*,.head>*{min-width:0}
.map>span{min-width:0}
.map select{max-width:100%}
select{max-width:100%;text-overflow:ellipsis}
.danger{white-space:normal;text-align:center;max-width:100%;background:none;border:1px solid var(--line);border-radius:4px;padding:6px 12px;color:var(--muted)}
.danger.armed{border-color:var(--fail);color:var(--fail)}

/* muscles */
.mhead{display:grid;grid-template-columns:auto 1fr auto auto 92px;gap:14px;align-items:center;width:100%;
  text-align:left;background:none;border:0;padding:12px 16px}
.mname{font-family:var(--fh);font-weight:700;font-size:1.2rem;text-transform:capitalize}
.stat{text-align:right;font-size:.9rem;color:var(--muted);line-height:1.2}
.stat b{display:block;color:var(--ink);font-family:var(--fh);font-size:1.15rem}
.spark{display:block}
.colhead{display:grid;grid-template-columns:30px 1fr auto auto 92px;gap:14px;padding:0 17px 6px;color:var(--muted);font-size:.8rem}
.colhead span{text-align:right}
.mline{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline;flex-wrap:wrap}
.mline .d{font-family:var(--fh);font-weight:700;min-width:4.5em}
.factor{color:var(--muted);font-size:.85rem}

/* log */
label{display:block;font-weight:500;margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=date],input[type=text],textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{resize:vertical}
#logText{min-height:220px;font-family:var(--fh);font-size:1.1rem;line-height:1.45}
#logNotes{min-height:80px}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.primary{margin-top:16px;width:100%;background:var(--accent);color:var(--paper);border:0;border-radius:6px;
  padding:14px;font-family:var(--fh);font-weight:700;font-size:1.2rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.preview{margin-top:18px}
.preview h3{margin:0 0 8px;font-size:1.15rem}
.issue{color:var(--fail);font-size:.9rem;margin:4px 0}
.map{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.map select{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--muted);padding:30px 0;text-align:center}
@media (max-width:520px){
  nav button{font-size:.98rem;padding:14px 2px}
  .mhead{grid-template-columns:auto 1fr auto auto 64px;gap:10px}
  .colhead{grid-template-columns:26px 1fr auto auto 64px;gap:10px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="h"></h1><button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>

const EXBY=Object.fromEntries(EX.map(e=>[e.id,e]));
const addEx=e=>{if(!EXBY[e.id]){EX.push(e);EXBY[e.id]=e}};

function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}}

function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;

}

 ["Barbell",["barbell","μπαρα","mpara","bara"]],["Cable",["cable","καλωδιο"]],["Rope",["rope","σχοινι","σκοινι"]],
 ["V bar",["v bar","vbar","v"]],["Straight bar",["ισιο"]],["Smith",["smith"]],["Wide",["wide","φαρδια","ανοιχτα","πλατυ"]],
 ["Horizontal bar",["horizontal bar","hor bar","οριζοντια μπαρα"]],["Small grip",["small grip","narrow grip","μικρο γκριπ","στενο γκριπ","στενο"]],

];
MODLIST.forEach(([l,ks])=>ks.forEach(k=>MODS[norm(k)]=l));
const STOP=new Set(["στο","στη","στην","σε","με","το","τα","η","ο","για","normal","κανονικα","κανονικο","κανονικη","ορθιος","ορθια","ορθιο","κυριοι","πολυ","βαθια","καλη","τεχνικη","γκριπ","grip","mixed","ξαπλα","ενα","καλα"].map(norm));
/* "BicepEZ (+8) καλό μηχ" → base "bicep", mods [EZ, Good machine]; numbers and (notes) in names are ignored */
function splitMods(raw){
  raw=raw.replace(/\([^)]*\)/g," ").replace(/[+]?\d+(?:[.,]\d+)?\S*/g," ");
  let ws=raw.split(/\s+/).map(norm).filter(Boolean);const mods=[];
  for(let i=0;i<ws.length-1;i++){const k=ws[i]+ws[i+1];if(MODS[k]&&ws.length>2){mods.push(MODS[k]);ws.splice(i,2);i--}}
  ws=ws.filter(w=>STOP.has(w)&&ws.length>1?false:true);
  ws=ws.filter(w=>MODS[w]&&ws.length>1?(mods.push(MODS[w]),false):true);
  ws=ws.map(w=>{const m=w.length>4&&w.match(/(ez|db)$/);if(!m)return w;mods.push(MODS[m[1]]);return w.slice(0,-2)});
  let u=[...new Set(mods)];if(u.some(m=>m.endsWith(" machine")))u=u.filter(m=>m!=="Machine");
  return{base:ws.join(""),mods:u};
}
function resolve(raw,idx){
  if(idx[norm(raw)])return{id:idx[norm(raw)],how:"exact",mods:[]};
  const {base:k,mods}=splitMods(raw);
  if(idx[k])return{id:idx[k],how:"exact",mods};
  const tol=k.length>=7?2:k.length>=4?1:0;
  if(!tol)return{id:null,how:null,mods};
  let best=null,bd=99;
  for(const key in idx){if(key[0]!==k[0])continue;const d=lev(k,key);if(d<bd){bd=d;best=key}} // same first letter: stops "triceps"→"biceps"
  return bd<=tol?{id:idx[best],how:"fuzzy",mods}:{id:null,how:null,mods};
}

/* ===================== parser ===================== */
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const HEADER=/^(.*?)\s*\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{1,2})\s*$/i;
const SPEC=/^(?:(\d+)[x×X])?(\d+)[x×X](.+)$/;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayISO=()=>iso(new Date());

function parsePart(p){
  const m=p.match(SPEC);if(!m)return null;
  const w=m[3];
  if(/^\d+[x×X]/.test(w))return null;
  const num=/^-?\d+(?:[.,]\d+)?$/.test(w);
  return{sets:m[1]?+m[1]:1,reps:+m[2],kg:num?parseFloat(w.replace(",",".")):null,variant:num?null:w};
}
function parseToken(t){
  t=t.replace(/[,;]+$/,"");if(!t)return null;
  const parts=t.split("+").map(parsePart);
  return parts.length&&parts.every(Boolean)?parts:null;
}
function headerDate(mon,day){
  const now=new Date();let d=new Date(now.getFullYear(),MONTHS[mon.slice(0,3).toLowerCase()],+day);
  if(d-now>86400000)d.setFullYear(d.getFullYear()-1); // no year in notes: assume most recent past
  return iso(d);
}
/* text → [{title,date,body}] */
function splitWorkouts(text,fallbackDate,fallbackTitle){
  const out=[];let cur=null;
  for(const line of text.split(/\r?\n/)){
    const t=line.trim(),h=t.match(HEADER);
    if(h&&!t.split(/\s+/).some(parseToken)){
      cur={title:h[1].replace(/^gym\s*/i,"").trim()||"Workout",date:headerDate(h[2],h[3]),body:""};out.push(cur);continue;
    }
    if(!cur){if(!t)continue;cur={title:fallbackTitle||"Workout",date:fallbackDate,body:""};out.push(cur)}
    cur.body+=line+"\n";
  }
  return out;
}
/* body → entries [{raw, groups:[{parts,note,failed}]}] */
function parseBody(body){
  const entries=[],issues=[];let cur=null;
  body.split(/\r?\n/).forEach((line,li)=>{
    const t=line.trim();if(!t)return;
    const toks=t.split(/\s+/),i=toks.findIndex(parseToken);
    if(i===-1){cur={raw:t,groups:[],lines:[li]};entries.push(cur);return}
    if(i>0){cur={raw:toks.slice(0,i).join(" "),groups:[],lines:[]};entries.push(cur)}
    if(!cur){issues.push(`Sets with no exercise above them: “${t}”`);return}
    cur.lines.push(li);
    const start=cur.groups.length;
    for(let j=i;j<toks.length;j++){
      const tk=toks[j];
      if(tk==="|"){cur.groups.slice(start).forEach(g=>g.warmup=true);continue} // "a b | c": a, b are warm-up
      const ps=parseToken(tk);
      if(ps){cur.groups.push({parts:ps});continue}
      const g=cur.groups[cur.groups.length-1];
      g.note=g.note?g.note+" "+tk:tk;
      if(/fail|αποτυχ/i.test(tk))g.failed=true;
    }
  });
  entries.filter(e=>!e.groups.length).forEach(e=>issues.push(`“${e.raw}” has no sets`));
  return{entries,issues};
}

/* ===================== derived tables ===================== */
function setsOf(g){return g.warmup?0:g.parts[0].sets} // warm-ups and drop-set continuations don't add sets
function volOf(g){return g.parts.reduce((s,p)=>s+p.sets*p.reps*(p.kg>0?p.kg:0),0)}
function facts(){
  const idx=aliasIndex(),rows=[];
  for(const w of db.workouts){
    const {entries}=parseBody(w.raw);
    entries.forEach(e=>{const r=resolve(e.raw,idx);e.ex=r.id;e.how=r.how;e.mods=r.mods});
    w._entries=entries;
    entries.forEach(e=>e.groups.forEach(g=>rows.push({w,date:w.date,ex:e.ex,raw:e.raw,mods:e.mods,g,sets:setsOf(g),vol:volOf(g)})));
  }
  return rows;
}
function maxKg(rows){
  const m={};
  rows.forEach(r=>{const k=r.ex||r.raw;r.g.parts.forEach(p=>{if(p.kg)m[k]=Math.max(m[k]||0,p.kg)})});
  return m;
}

/* ===================== rendering helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=s=>{const d=new Date(s+"T00:00");return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const daysAgo=s=>Math.round((new Date(todayISO()+"T00:00")-new Date(s+"T00:00"))/86400000);
function partLabel(p){
  const load=p.kg===null?p.variant:p.kg===0?"BW":p.kg<0?`${p.kg} assist`:p.kg;
  return `${p.sets>1?p.sets+"×":""}${p.reps} @ ${load}`;
}
function chip(g,max){
  const p0=g.parts[0];
  const isVar=g.parts.some(p=>p.kg===null);
  const frac=max&&p0.kg>0?p0.kg/max:0;
  const pct=Math.round(8+frac*62);
  const style=isVar?"":`background:color-mix(in srgb,var(--accent) ${pct}%,var(--paper));${pct>45?"color:var(--paper)":""}`;
  const label=g.parts.map(partLabel).join(" ↘ ");
  return `<span class="chip${isVar?" variant":""}${g.failed?" failed":""}${g.warmup?" warm":""}" style="${style}" title="${g.warmup?"Warm-up":g.parts.length>1?"Superset":""}">${esc(label)}</span>`;
}
function exLine(e,max,del){
  const ex=e.ex&&EXBY[e.ex];
  const name=ex?ex.name:e.raw;
  const rawTag=ex&&norm(ex.name)!==norm(e.raw)?`<span class="raw">${esc(e.raw)}${e.how==="fuzzy"?" (≈ guessed)":""}</span>`:"";
  const flag=!ex?`<span class="flag">unmapped</span>`:"";
  const notes=e.groups.filter(g=>g.note).map(g=>`<div class="note${g.failed?" fail":""}">${esc(g.note)}</div>`).join("");

    <div class="chips">${e.groups.map(g=>chip(g,max[e.ex||e.raw])).join("")}</div>${notes}</div>`;
}

/* ===================== records ===================== */
const better=(a,b)=>!b||a.kg>b.kg||(a.kg===b.kg&&a.reps>b.reps); // ties keep the earliest
function records(rows){
  const R={};
  [...rows].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    const key=entryKey(r);
    const o=R[key]||(R[key]={key,ex:r.ex,raw:r.raw,raws:new Set(),mods:r.mods||[],heavy:null,heavy5:null,reps:null,last:null,sessions:{}});
    o.raws.add(r.raw);
    o.last=r.date;
    if(r.g.warmup)return; // warm-ups never set records
    const sets=[];r.g.parts.forEach(p=>{for(let i=0;i<p.sets;i++)sets.push({reps:p.reps,kg:p.kg,variant:p.variant,date:r.date})});
    if(r.g.failed)sets.pop(); // "fail on last": last set doesn't count
    const s=o.sessions[r.w.id]||(o.sessions[r.w.id]={date:r.date,best:null});
    sets.forEach(x=>{
      if(!o.reps||x.reps>o.reps.reps||(x.reps===o.reps.reps&&x.kg>o.reps.kg))o.reps=x; // tie → heavier
      if(x.kg===null)return;
      if(better(x,o.heavy))o.heavy=x;
      if(x.reps>=5&&better(x,o.heavy5))o.heavy5=x;
      if(better(x,s.best))s.best=x;
    });
  });
  return Object.values(R).sort((a,b)=>b.last.localeCompare(a.last));
}

const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
/* 7-day rolling mean (time window), healthy BMI 18.5–24.9 band from height */
function weightChart(pts,height){
  const W=600,H=260,L=44,R=12,T=14,B=30;
  if(!pts.length)return `<p class="empty" style="padding:30px 0">No weigh-ins yet.</p>`;
  const ts=pts.map(p=>+new Date(p.t)),DAY=864e5;
  const avg=pts.map((p,i)=>{const w=pts.filter((q,j)=>ts[j]<=ts[i]&&ts[j]>ts[i]-7*DAY);return w.reduce((a,q)=>a+q.kg,0)/w.length});
  let lo=Math.min(...pts.map(p=>p.kg)),hi=Math.max(...pts.map(p=>p.kg));
  const band=height?[18.5*(height/100)**2,24.9*(height/100)**2]:null;
  if(band){ if(lo>band[1])lo=band[1]-1; else if(hi<band[0])hi=band[0]+1; } // keep the nearest healthy edge in view
  const pad=Math.max((hi-lo)*.12,.8);lo-=pad;hi+=pad;
  let t0=ts[0],t1=ts[ts.length-1];if(t1-t0<DAY){t0-=3*DAY;t1+=3*DAY}
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R),Y=k=>T+(hi-k)/(hi-lo)*(H-T-B);
  const step=[.5,1,2,5,10,20].find(s=>(hi-lo)/s<=6),yt=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)yt.push(v);
  const months=[];const d=new Date(t0);d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()+1);
  const span=(t1-t0)/DAY,every=span>500?3:span>200?2:1;
  for(let i=0;+d<=t1;i++,d.setMonth(d.getMonth()+1))if(i%every===0)months.push(+d);
  const fmtM=t=>new Date(t).toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
  const bandSvg=band?(()=>{const y1=Math.max(T,Y(Math.min(band[1],hi))),y2=Math.min(H-B,Y(Math.max(band[0],lo)));
    return y2>y1?`<rect x="${L}" y="${y1}" width="${W-L-R}" height="${y2-y1}" fill="#3fae6a" opacity=".18"/>`:""})():"";
  const line=pts.map((p,i)=>`${X(ts[i]).toFixed(1)},${Y(avg[i]).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bodyweight with 7-day average">
    ${bandSvg}
    ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${+v.toFixed(1)}</text>`).join("")}
    ${months.map(t=>`<text x="${X(t)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${fmtM(t)}</text>`).join("")}
    ${pts.map((p,i)=>`<circle cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3" fill="var(--muted)" opacity=".7"/>`).join("")}
    ${pts.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${line}"/>`:""}
  </svg>
  <div class="chips" style="margin-top:6px;font-size:.85rem;color:var(--muted)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px"></span>Weigh-ins</span>
    <span style="margin-left:10px"><span style="display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:3px;margin-right:5px"></span>7-day average</span>
    ${band?`<span style="margin-left:10px"><span style="display:inline-block;width:12px;height:10px;background:#3fae6a;opacity:.4;vertical-align:-1px;margin-right:5px"></span>Healthy BMI (${band[0].toFixed(1)}–${band[1].toFixed(1)} kg)</span>`:""}
  </div>`;
}

/* "Push: chest, shoulders" per line → groups; missing muscles go to Other */
function textToSplit(text){
  const groups=[],errors=[],seen=new Set(),byN=Object.fromEntries(MUSCLES.map(m=>[norm(m),m]));
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim())return;
    const c=line.indexOf(":");
    if(c<1){errors.push(`Line ${i+1}: needs “Group: muscle, muscle”`);return}
    const ms=[];
    line.slice(c+1).split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{
      const m=byN[norm(x)];
      if(!m)errors.push(`Unknown muscle “${x}”`);else if(seen.has(m))errors.push(`“${m}” listed twice`);else{seen.add(m);ms.push(m)}
    });
    groups.push([line.slice(0,c).trim(),ms]);
  });
  const miss=MUSCLES.filter(m=>!seen.has(m));
  if(miss.length)groups.push(["Other",miss]);
  return{groups:groups.filter(g=>g[1].length),errors,miss};
}

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="text" id="splitName" placeholder="Preset name" style="flex:1;min-width:10em">
      <button class="danger" id="splitSave">Save as preset</button>
      ${st.custom&&st.custom[st.split]?`<button class="danger" id="splitUpd">Update “${esc(st.custom[st.split].name)}”</button><button class="danger" id="splitDel">Delete</button>`:""}
    </div>
    <label for="exq">Exercises</label>
    <input type="text" id="exq" placeholder="Search ${EX.length} exercises">
    <div id="exlist" style="margin-top:8px"></div>
    <label>Data</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <label class="danger" style="margin:0;font-weight:400;cursor:pointer">Import .json<input type="file" id="imp" accept=".json,application/json" hidden></label>
      <button class="danger" id="exp" hidden>Export .json</button>
      <button class="danger" id="wipe">Delete all workouts</button>
    </div>
    <p class="hint">${db.workouts.length} workouts on this device. Importing skips workouts already here.</p>
    <label for="font">Font</label><select id="font" style="width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px">
      ${Object.keys(FONTS).map(f=>`<option ${(st.font||"Commissioner")===f?"selected":""}>${f}</option>`).join("")}</select>
    <p class="hint">All options include Greek letters.</p>
    <div class="row" style="margin-top:14px;padding:12px 16px"><span class="exname">Sample</span><div class="chips">
      <span class="chip" style="background:color-mix(in srgb,var(--accent) 60%,var(--paper));color:var(--paper)">3×6 @ 100</span>
      <span class="chip" style="background:color-mix(in srgb,var(--accent) 30%,var(--paper))">10 @ 60</span>
      <span class="chip variant">2×10 @ μετρια</span></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="danger" data-p="dark">Default dark</button><button class="danger" data-p="light">Default light</button></div>`;
  const setC=(k,v)=>{const s=load(SKEY,{});s[k]=v;store(SKEY,s);applySettings()};
  $("#view").querySelectorAll("[data-c]").forEach(i=>i.oninput=()=>{setC(i.dataset.c,i.value);$(`[data-h="${i.dataset.c}"]`).value=i.value.toUpperCase()});
  $("#view").querySelectorAll("[data-h]").forEach(i=>i.oninput=()=>{
    let v=i.value.trim();if(!v.startsWith("#"))v="#"+v;
    const ok=/^#[0-9a-f]{6}$/i.test(v);i.style.borderColor=ok?"":"var(--fail)";
    if(ok){setC(i.dataset.h,v.toLowerCase());$(`[data-c="${i.dataset.h}"]`).value=v.toLowerCase()}
  });
  $("#view").querySelectorAll("[data-tab-on]").forEach(c=>c.onchange=()=>{
    const on=[...$("#view").querySelectorAll("[data-tab-on]")].filter(x=>x.checked).map(x=>x.dataset.tabOn);
    if(!on.length){c.checked=true;toast("Keep at least one tab");return}
    const st=load(SKEY,{});st.tabs=on;store(SKEY,st);applyTabs();
  });
  const exq=$("#exq");exq.oninput=()=>renderExList(exq.value);renderExList("");
  $("#split").onchange=e=>{const s=load(SKEY,{});s.split=e.target.value;store(SKEY,s);renderSettings();toast("Muscle order updated")};
  const check=()=>{const r=textToSplit($("#splitText").value);const m=$("#splitMsg");
    if(r.errors.length){m.className="issue";m.textContent=r.errors.join(". ")}
    else{m.className="hint";m.textContent=r.miss.length?`Not listed, will go under Other: ${r.miss.join(", ")}`:"Looks good."}
    return r.errors.length?null:r};
  $("#splitText").oninput=check;
  $("#splitSave").onclick=()=>{const r=check();if(!r)return;const name=$("#splitName").value.trim();
    if(!name){$("#splitName").focus();$("#splitMsg").className="issue";$("#splitMsg").textContent="Give the preset a name first.";return}
    const s=load(SKEY,{});s.custom=s.custom||{};const id="c_"+uid();s.custom[id]={name,groups:r.groups};s.split=id;store(SKEY,s);renderSettings();toast(`“${name}” saved`)};
  if($("#splitUpd"))$("#splitUpd").onclick=()=>{const r=check();if(!r)return;const s=load(SKEY,{});s.custom[s.split].groups=r.groups;store(SKEY,s);renderSettings();toast("Preset updated")};
  if($("#splitDel"))$("#splitDel").onclick=e=>{const b=e.target;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap again to delete";return}
    const s=load(SKEY,{});delete s.custom[s.split];s.split="ppl";store(SKEY,s);renderSettings();toast("Preset deleted")};
  $("#imp").onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    try{
      const j=JSON.parse(await f.text()),have=new Set(db.workouts.map(w=>w.id));let n=0;
      for(const w of (j.workouts||j)){
        if(!w||!/^\d{4}-\d\d-\d\d$/.test(w.date)||typeof w.raw!=="string"||have.has(w.id))continue;
        db.workouts.push({id:w.id||uid(),date:w.date,title:String(w.title||"Workout"),raw:w.raw,notes:String(w.notes||""),original:String(w.original||"")});n++;
      }
      const hw=new Set(db.weights.map(x=>x.id));let nw=0;
      for(const x of (j.weights||[]))if(x&&typeof x.kg==="number"&&/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(x.t)&&!hw.has(x.id)){db.weights.push({id:x.id||uid(),t:x.t,kg:x.kg});nw++}
      for(const e of (j.exercises||[]))if(e&&e.id&&e.name&&!EXBY[e.id]){const x={id:String(e.id),name:String(e.name),a:(e.a||[]).map(String),m:e.m||{}};db.exercises.push(x);addEx(x)}
      Object.entries(j.exOverrides||{}).forEach(([id,o])=>{if(EXBY[id]&&!db.exOverrides[id]){db.exOverrides[id]=o;Object.assign(EXBY[id],o)}});
      if(!db.height&&j.height>=100&&j.height<=250)db.height=j.height;
      Object.assign(db.aliases,j.aliases||{});store(KEY,db);toast(`${n} workouts, ${nw} weigh-ins imported`);renderSettings();
    }catch(err){toast("Not a Liftlog file")}
  };
  (async()=>{const dl=window.claude&&await window.claude.use("downloads");if(tab!=="settings"||!$("#exp"))return;
    $("#exp").hidden=false;
    $("#exp").onclick=async()=>{
      const fn=`liftlog-${todayISO()}.json`,data=JSON.stringify({app:"liftlog",version:1,workouts:db.workouts.map(({_entries,...w})=>w),weights:db.weights,height:db.height||null,exercises:db.exercises,exOverrides:db.exOverrides,aliases:db.aliases});
      if(dl){try{await dl.save({filename:fn,data})}catch(e){if(e&&e.code!=="declined")toast("Export unavailable here")}return}
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    };
  })();
  $("#wipe").onclick=e=>{const b=e.target;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap again to delete everything";return}
    db.workouts=[];store(KEY,db);toast("All workouts deleted");renderSettings()};
  $("#font").onchange=e=>{const s=load(SKEY,{});s.font=e.target.value;store(SKEY,s);applySettings()};
  $("#view").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const s=load(SKEY,{});Object.assign(s,PRESETS[b.dataset.p]);store(SKEY,s);applySettings();renderSettings();toast(b.textContent+" applied")});
}

/* ===================== boot ===================== */
applySettings();
if(!db){db={workouts:[],aliases:{}};store(KEY,db)}
db.weights=db.weights||[];db.exercises=db.exercises||[];db.exercises.forEach(addEx);db.exOverrides=db.exOverrides||{};applyOverrides();
// installable/offline when hosted (GitHub Pages); harmlessly fails elsewhere
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
applyTabs();setTab(shownTabs()[0]);
</script>
</body>
</html>
